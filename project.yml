# XcodeGen project definition (the GitHub build runs `xcodegen generate` to create ThongDich.xcodeproj).
name: ThongDich
options:
  bundleIdPrefix: com.thongdich
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  ThongDichKit:
    path: ThongDichKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"

targets:
  ThongDich:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App
    dependencies:
      - package: ThongDichKit
        product: ThongDichKit
    scheme: {}          # creates the "ThongDich" scheme used by the cloud build
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thongdich.app
        PRODUCT_NAME: ThongDich
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/ThongDich.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
